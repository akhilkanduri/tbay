# One command to a full playground: `Dev Containers: Reopen in Container` in
# VS Code (or `devcontainer up` from the CLI) starts Python with uv plus a
# real Postgres and a real Redis, wired up through the TBAY_* environment
# variables below. Every example and the full test suite (including the
# Postgres- and Redis-gated tests) runs out of the box, no local setup.
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - ..:/workspaces/tbay:cached
    environment:
      # examples default to SQLite inside the container; point TBAY_DB_URL at
      # postgres or redis below to try a shared backend instead
      TBAY_DB_URL: sqlite:///~/.tbay/db.sqlite
      TBAY_TEST_PG_DSN: postgresql://postgres:tbay@postgres:5432/tbay
      TBAY_TEST_REDIS_URL: redis://redis:6379/0
      # the monitoring dashboard (dashboard/app.py) watches these by default
      TBAY_DASHBOARD_DBS: sqlite:///~/.tbay/db.sqlite,postgresql://postgres:tbay@postgres:5432/tbay,redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: tbay
      POSTGRES_DB: tbay
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
